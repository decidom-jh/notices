name: 공고 받기

on:
  schedule:
    - cron: "0 21 * * *" # 한국 아침 6시
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: 점검
        run: deno run scripts/test.ts
      - name: 받기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          BIZINFO_KEY: ${{ secrets.BIZINFO_KEY }}
        run: deno run --allow-net --allow-env --allow-read --allow-write scripts/fetch.ts
      - name: 바뀐 것 올리기
        run: |
          git config user.name "notices-bot"
          git config user.email "notices-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -q -m "공고 $(date -u -d '+9 hours' +%Y-%m-%d)"
          git push
